<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Minecraft Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="contenedor-principal" style="width: 450px; margin-top: 80px;">
        <header style="padding: 15px;">
            <h1 style="font-size: 32px;">📝 CREAR CUENTA</h1>
        </header>

        <div class="articulo" style="text-align: center;">
            <p>Únete a la comunidad de mineros.</p>
            
            <form id="formulario-registro">
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="font-weight: bold;">Nombre de Usuario (Nick):</label><br>
                    <input type="text" id="reg-usuario" required style="width: 95%; padding: 8px; font-family: 'FuenteMinecraft', monospace; font-size: 20px; border: 2px solid #555; background: #eee;">
                </div>

                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="font-weight: bold;">Correo Electrónico:</label><br>
                    <input type="email" id="reg-correo" required style="width: 95%; padding: 8px; font-family: 'FuenteMinecraft', monospace; font-size: 20px; border: 2px solid #555; background: #eee;">
                </div>
                
                <div style="margin-bottom: 25px; text-align: left;">
                    <label style="font-weight: bold;">Contraseña:</label><br>
                    <input type="password" id="reg-contrasena" required style="width: 95%; padding: 8px; font-family: 'FuenteMinecraft', monospace; font-size: 20px; border: 2px solid #555; background: #eee;">
                </div>
                
                <button type="submit" style="background: #4CAF50; color: white; border: 4px solid #388E3C; padding: 10px 20px; font-family: 'FuenteMinecraft', monospace; font-size: 22px; cursor: pointer; text-shadow: 2px 2px 0px #000; width: 100%;">Registrarse</button>
            </form>

            <p id="mensaje-error-reg" style="color: #d32f2f; margin-top: 15px; font-weight: bold;"></p>
            
            <hr style="border-top: 2px dashed #888; margin: 20px 0;">
            
            <p style="font-size: 18px;">¿Ya tienes cuenta? <a href="login.html" style="color: blue;">Inicia sesión aquí</a></p>
            <p style="font-size: 18px;"><a href="index.html" style="color: #555; text-decoration: none;">← Volver al inicio</a></p>
        </div>
    </div>

    <footer id="pie-pagina">
        <p>⛏️ MINECRAFT BLOG © 2026 - Desarrollado por Angel ⛏️</p>
        <p style="color: #aaa; font-size: 18px;">No estamos afiliados con Mojang AB ni Microsoft Corporation.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
